<title>HAI-FX Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the preview never leaves the screen. Wide: preview left, controls right, each scrolls on
   its own. Narrow (the side panel): preview pinned at the top, controls scroll underneath it.
   UI chrome is cool teal so it never competes with the warm effect colours. */
:root {
  --bg: #111015; --panel: #18171e; --panel-2: #201f28; --line: #2d2b37; --line-2: #3a3846;
  --text: #ece9f3; --muted: #9c98ab; --faint: #6c6879;
  --accent: #57d1c0; --accent-ink: #072622; --accent-soft: rgba(87, 209, 192, 0.14);
  --warn: #f2b84b; --bad: #ef6a5a; --good: #6fd08c; --claude: #c9a6ff; --claude-soft: rgba(201, 166, 255, 0.12);
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-mark: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
  --r: 6px; --headH: 49px;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.app { display: flex; flex-direction: column; min-height: 100%; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; }
.mark { font: 600 16px/1 var(--f-mark); letter-spacing: 0.06em; color: var(--accent); }
.mark span { color: var(--text); }
.fxname { font-weight: 600; font-size: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.ok { background: var(--good); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.claude { background: var(--claude); }
.spacer { flex: 1; }
.btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 5px 11px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.claude { background: var(--claude-soft); border-color: rgba(201, 166, 255, 0.5); color: #e6d8ff; font-weight: 500; }
.btn:disabled { opacity: 0.45; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); border-color: var(--line-2); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.danger { color: var(--bad); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.drawer { padding-block: 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); display: flex; flex-direction: column; gap: 8px; }
.drawer.claude { background: #1f1a2b; }
.drawer p { margin: 0; max-width: 72ch; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 8px; background: #172522; border-bottom: 1px solid var(--line); }
.banner.claude { background: #221b31; }
.tin { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; min-width: 0; width: 100%; }
.tin:focus { border-color: var(--accent); outline: none; }
textarea.tin { resize: vertical; min-height: 56px; }
select.tin { padding: 3px 4px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---------- workbench */
.work { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.viewer { min-width: 0; display: flex; flex-direction: column; background: var(--bg); border-right: 1px solid var(--line); }
.panel { min-width: 0; background: var(--panel); }
@media (min-width: 900px) {
  .app { height: 100%; }
  .work { height: 0; }
  .viewer, .panel { overflow: auto; }
}
@media (max-width: 899px) {
  .work { grid-template-columns: minmax(0, 1fr); }
  .viewer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--headH)); z-index: 6; border-right: 0; border-bottom: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
  .stagebox { height: min(40vh, 100vw); flex: none !important; }
}
.stagebox { flex: 1; min-height: 180px; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; overflow: hidden; }
.stage { position: relative; line-height: 0; box-shadow: 0 0 0 1px var(--line); flex: none; }
.stage canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
.refside { margin: 0; position: relative; flex: none; display: flex; align-items: center; justify-content: center; background: #000; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.refside img { max-width: 100%; max-height: 100%; display: block; object-fit: contain; }
.refside .lbl, .bgchip { position: absolute; left: 6px; top: 6px; line-height: 1.3; font-size: 11px; background: rgba(17,16,21,0.82); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 4px 2px 8px; display: flex; gap: 4px; align-items: center; max-width: calc(100% - 12px); }
.refside .lbl span, .bgchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--muted); padding: 0 4px; font-size: 13px; line-height: 1; }
.x:hover { color: var(--text); }
.pin { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(17, 16, 21, 0.75);
  color: #fff; font: 600 11px/18px var(--f-mono); text-align: center; padding: 0; box-shadow: 0 0 0 1px rgba(0,0,0,0.6); }
.pin.claude { border-color: var(--claude); }
.pin.done { opacity: 0.45; }
.pin.hot { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.composer { position: absolute; z-index: 9; width: min(320px, calc(100vw - 48px)); background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; padding: 12px; line-height: 1.45;
  box-shadow: 0 12px 40px rgba(0,0,0,0.55); display: flex; flex-direction: column; gap: 8px; }
.composer.sheet { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: auto; z-index: 25; }
.hits, .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.transport, .viewbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); }
.transport input[type="range"] { flex: 1 1 140px; min-width: 100px; accent-color: var(--accent); }
.tread { color: var(--muted); white-space: nowrap; }
.tread b { color: var(--text); font-weight: 500; }
.viewbar select, .transport select { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: var(--r); padding: 3px 5px; max-width: 160px; }
.viewbar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 3px 9px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.ibtn { width: 28px; height: 26px; border: 0; background: transparent; color: var(--muted); border-radius: 4px; display: grid; place-items: center; font-size: 12px; font-family: var(--f-mono); flex: none; }
.ibtn:hover { color: var(--text); background: var(--panel-2); }
.ibtn[aria-pressed="true"] { color: var(--accent); }
.summary { margin-left: auto; display: flex; gap: 8px; align-items: center; background: none; border: 1px solid transparent; border-radius: var(--r); padding: 2px 6px; color: var(--muted); font-size: 12px; }
.summary:hover { border-color: var(--line-2); color: var(--text); }

/* ---------- panel */
.ask { padding: 12px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #1d1928, var(--panel)); display: flex; flex-direction: column; gap: 6px; }
.ask label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #cdb6f5; }
.ask .row .tin { flex: 1 1 180px; }
.ask .status { color: var(--muted); font-size: 12px; }
.tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; overflow-x: auto; scrollbar-width: none; }
@media (max-width: 899px) { .tabs { position: static; } }
.tabs button { flex: 1 0 auto; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 9px 8px; color: var(--muted); font-weight: 500; }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabs .count { font: 500 10px var(--f-mono); background: var(--panel-2); border-radius: 999px; padding: 1px 5px; margin-left: 4px; color: var(--muted); }
.tabs .count.hot { background: var(--claude); color: #1d1330; }
.sec { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.layers { display: flex; flex-direction: column; gap: 2px; }
.lrow { display: grid; grid-template-columns: 28px 28px minmax(0, 1fr) auto; align-items: center; gap: 2px; border-radius: var(--r); padding: 1px; border: 1px solid transparent; }
.lrow.sel { background: var(--accent-soft); border-color: rgba(87, 209, 192, 0.35); }
.lrow .name { background: none; border: 0; text-align: left; padding: 5px 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .name small { color: var(--muted); margin-left: 6px; font-size: 11px; }
.tag { font: 500 10px/1 var(--f-mono); padding: 3px 5px; border-radius: 4px; background: var(--panel-2); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
.tag.add { color: #ffcf8a; } .tag.changed { color: var(--warn); }
.param { display: grid; grid-template-columns: 98px minmax(0, 1fr) 62px; gap: 8px; align-items: center; padding: 3px 0; }
.param label { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.param label.changed { color: var(--warn); }
.param input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
.param .num { width: 100%; text-align: right; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; font: 12px var(--f-mono); }
.param .wide { grid-column: 2 / 4; display: flex; gap: 6px; align-items: center; min-width: 0; }
.param .wide select { flex: 1; min-width: 0; }
.help { grid-column: 1 / -1; color: var(--faint); font-size: 11px; margin-top: -2px; }
.lhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lhead .tin { flex: 1 1 140px; font-weight: 600; }
.swatch { width: 30px; height: 24px; border: 1px solid var(--line-2); border-radius: 4px; padding: 0; background: none; flex: none; }
input[type="color"].swatch::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"].swatch::-webkit-color-swatch { border: 0; border-radius: 3px; }
.pal { display: flex; flex-direction: column; gap: 4px; }
.prow { display: grid; grid-template-columns: 30px minmax(0, 1fr) 84px 24px; gap: 6px; align-items: center; }
.empty { padding: 14px; color: var(--muted); }
.card { margin: 10px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); display: flex; flex-direction: column; gap: 6px; }
.card.claude { border-color: rgba(201, 166, 255, 0.35); }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
.card .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { border-left: 2px solid var(--claude); padding-left: 8px; color: #ddd0f5; white-space: pre-wrap; overflow-wrap: anywhere; }
.diff { font: 12px/1.6 var(--f-mono); margin: 0; padding: 0; list-style: none; overflow-wrap: anywhere; }
.diff .from { color: var(--faint); text-decoration: line-through; }
.diff .to { color: var(--warn); }
.refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 10px 12px; }
.ref { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel-2); display: flex; flex-direction: column; }
.ref img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; cursor: zoom-in; background: #000; }
.ref .tin { border: 0; border-top: 1px solid var(--line); border-radius: 0; font-size: 12px; }
.ref .row { padding: 6px; }
.spark { display: flex; flex-direction: column; gap: 4px; min-width: 0; margin-bottom: 10px; }
.spark .lbl { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.spark svg { width: 100%; height: 60px; display: block; }
.facts { display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 12px; margin: 0 0 10px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; }
.check .mono { color: var(--muted); margin-left: auto; }

/* ---------- full-screen overlays: compare, reference picker */
.overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 30; }
.ohead, .ofoot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 10px; background: var(--panel); }
.ohead { border-bottom: 1px solid var(--line); padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.ofoot { border-top: 1px solid var(--line); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.ohead h3 { margin: 0; font-size: 15px; }
.ohead p { margin: 0; color: var(--muted); flex-basis: 100%; max-width: 80ch; }
.obody { flex: 1; overflow: auto; padding-block: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46%, 220px), 1fr)); gap: 12px; }
.cell { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
.cell[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cell.refcell { cursor: default; border-style: dashed; }
.cell canvas, .cell img { width: 100%; aspect-ratio: 1; height: auto; image-rendering: pixelated; display: block; border-radius: 4px; object-fit: contain; background: #000; }
.cell .k { font: 600 14px var(--f-mark); color: var(--accent); }
.cell .cl { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ofoot .tin { flex: 1 1 220px; }
.refview { display: flex; justify-content: center; }
.refview canvas { max-width: 100%; height: auto; cursor: crosshair; }
.picked { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.picked .sw { width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--line-2); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 8px 14px; z-index: 40; box-shadow: 0 8px 30px rgba(0,0,0,0.5); max-width: calc(100vw - 32px); }
@media (max-width: 560px) {
  .mark, .fxname { display: none; }
  .hide-sm { display: none !important; }
  .stagebox { height: min(34vh, 100vw) !important; padding: 6px; }
  .transport, .viewbar { padding: 4px 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app" id="app">
  <header class="top gut" id="top">
    <div class="mark">HAI<span>·FX</span></div>
    <div class="fxname" id="fxName">Explosion</div>
    <span class="pill" id="verPill"><span class="dot"></span><span>Loading…</span></span>
    <div class="spacer"></div>
    <button class="btn claude" id="sendBtn" title="Wake Claude in your chat to do a full round on this effect">Send to Claude</button>
    <button class="btn primary" id="saveBtn" disabled>Save</button>
  </header>
  <div class="drawer gut" id="saveDrawer" hidden>
    <div class="row"><strong id="saveTitle">Save</strong><span class="muted">Claude reads every saved version and the exact changes in it.</span></div>
    <ul class="diff" id="saveDiff"></ul>
    <div class="row">
      <input class="tin" id="saveMsg" placeholder="What did you change, and why? (optional)" style="flex:1 1 240px">
      <button class="btn primary" id="saveGo">Save</button>
      <button class="btn ghost" id="saveCancel">Cancel</button>
    </div>
  </div>
  <div class="drawer claude gut" id="sendDrawer" hidden></div>
  <div class="banner gut" id="banner" hidden></div>
  <div class="banner claude gut" id="choiceBar" hidden></div>

  <main class="work">
    <section class="viewer" id="viewer" aria-label="Preview">
      <div class="stagebox" id="stagebox">
        <div class="stage" id="stage">
          <canvas id="stageCanvas" width="384" height="384" aria-label="Effect preview. Click to pin a note."></canvas>
          <div class="bgchip" id="bgChip" hidden><span id="bgChipText"></span><button class="x" id="bgChipX" aria-label="Stop using image as background">×</button></div>
        </div>
        <figure class="refside" id="refSide" hidden>
          <img id="refSideImg" alt="">
          <figcaption class="lbl"><span id="refSideText">Reference</span><button class="x" id="refSideX" aria-label="Hide reference">×</button></figcaption>
        </figure>
      </div>
      <div class="transport">
        <button class="btn small" id="playBtn" aria-label="Pause" style="min-width:56px">Pause</button>
        <button class="ibtn" id="prevBtn" aria-label="Previous frame">◀</button>
        <button class="ibtn" id="nextBtn" aria-label="Next frame">▶</button>
        <input type="range" id="scrub" min="0" max="23" value="0" aria-label="Frame">
        <span class="tread mono" id="tread"><b>00</b>/24</span>
        <select id="speed" class="hide-sm" aria-label="Playback speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select>
      </div>
      <div class="viewbar">
        <label>Background <select id="bgSel" aria-label="Background"></select></label>
        <div class="seg" role="group" aria-label="Render mode"><button id="modeSmooth" aria-pressed="true">Smooth</button><button id="modePixel" aria-pressed="false">Pixel</button></div>
        <select id="zoom" aria-label="Zoom" class="hide-sm"><option value="fit">Fit</option><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option><option value="4">4×</option></select>
        <label class="hide-sm"><input type="checkbox" id="loopChk" checked> Loop</label>
        <button class="summary" id="summary" title="Open measurements"></button>
      </div>
    </section>

    <section class="panel" id="panel" aria-label="Controls">
      <div class="ask" id="askBox">
        <label for="askText">Ask Claude for a change</label>
        <div class="row">
          <input class="tin" id="askText" placeholder="e.g. bigger plumes, more red at the edges, linger longer">
          <button class="btn claude" id="askBtn">Ask</button>
        </div>
        <div class="status" id="askStatus">Claude suggests three versions of your change; you compare them on the preview and pick one.</div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="edit" aria-selected="true">Edit</button>
        <button role="tab" data-tab="colours" aria-selected="false">Colours</button>
        <button role="tab" data-tab="choices" aria-selected="false">Choices<span class="count" id="cCount">0</span></button>
        <button role="tab" data-tab="notes" aria-selected="false">Notes<span class="count" id="nCount">0</span></button>
        <button role="tab" data-tab="refs" aria-selected="false">Refs</button>
        <button role="tab" data-tab="measure" aria-selected="false">Measure</button>
        <button role="tab" data-tab="history" aria-selected="false">History</button>
      </div>
      <div id="tabBody"></div>
    </section>
  </main>
</div>

<script src="fxcore.js"></script>
<script>
(function () {
'use strict';
const FX = window.FXCore;
const EID = (location.hash || '').replace('#', '').replace(/[^a-z0-9_-]/gi, '') || 'explosion';
const $ = id => document.getElementById(id);
const BGS = { dark: ['Dark', '#14121a'], black: ['Black', '#000000'], mid: ['Mid grey', '#5b5866'], light: ['Light', '#d9d6e0'], checker: ['Checker', null] };
const QUICK = ['too fast', 'too slow', 'too bright', 'too dim', 'too big', 'too small', 'colour off', 'too busy', 'needs more', 'love this'];
const ASSET_RE = /^[0-9a-f]{32}$/i;
// Everything for an effect lives in ONE collection, one document per item, each with a `kind`

function paintBg(ctx, w, hgt) {

let worker = null;
(async () => {
  try {
    const src = await (await fetch('fxcore.js')).text();
    const blob = new Blob([src, '\nself.onmessage = e => { try { postMessage({ gen: e.data.gen, r: FXCore.measure(e.data.effect) }); } catch (err) { postMessage({ gen: e.data.gen, error: String(err) }); } };'], { type: 'text/javascript' });
    const w = new Worker(URL.createObjectURL(blob));
    w.onmessage = ev => { if (ev.data.gen === S.metricsGen && ev.data.r) { S.metrics = ev.data.r; renderMetrics(); } };
    worker = w;
  } catch (e) { worker = null; }
})();
let mTimer = 0;

}

const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

async function download() {
  if (!S.downloads) { toast('Downloads need the Claude app. Claude can also export straight into the repo.'); return; }
  const e = clean(S.cur), ex = FX.exportPasses(e), size = ex.size;
  const cols = Math.min(ex.frameCount, 8), rows = Math.ceil(ex.frameCount / cols);
  const files = [], atlas = { meta: { effect: EID, size, fps: ex.fps, frames: ex.frameCount, mode: e.canvas.mode, version: S.baseVersion, generator: 'hai-fx studio' }, passes: [] };
  for (const p of ex.passes) {
    const c = document.createElement('canvas'); c.width = cols * size; c.height = rows * size;
    const ctx = c.getContext('2d');

  try { await S.downloads.save({ filename: `${EID}_v${S.baseVersion}${changes().length ? '_edited' : ''}.zip`, data: zip(files) }); }
  catch (err) { if (err.code !== 'declined') toast('Download failed: ' + (err.code || err.message)); }
}

$('loopChk').onchange = e => { S.loop = e.target.checked; };
$('zoom').value = S.zoom;
$('zoom').onchange = e => { S.zoom = e.target.value; store.set('zoom', S.zoom); layoutStage(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeComposer(); closeOverlay(); return; }
  if (e.target.closest('input, textarea, select')) return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!S.playing); }
  else if (e.key === 'ArrowLeft') { setPlaying(false); setFrame(S.frame - 1); }
  else if (e.key === 'ArrowRight') { setPlaying(false); setFrame(S.frame + 1); }
});

// ------------------------------------------------------------------ boot
function banner(content) { const b = $('banner'); b.textContent = ''; if (!content) { b.hidden = true; return; } b.append(...[].concat(content)); b.hidden = false; }
async function boot() {
  let starter = null;
  try { starter = await (await fetch(EID + '.json')).json(); } catch (e) {}
  if (!starter) starter = { id: EID, name: EID, layers: [{ id: 'flash', type: 'glow' }] };
  S.base = FX.normalizeEffect(starter); S.cur = FX.normalizeEffect(starter); S.baseVersion = 0;
  fillBgSelect(); renderTabs(); updateHeader(); layoutStage(); rerender();
  requestAnimationFrame(tick);

  const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, assets, downloads, comments, sample] = await Promise.all([use('db'), use('assets'), use('downloads'), use('comments'), use('sample')]);
  Object.assign(S, { db, assets, downloads, comments, sample });
  if (!sample) { $('askBtn').disabled = true; $('askStatus').textContent = 'Asking Claude from the page needs the Claude app.'; }
  if (!comments) $('sendBtn').title = 'Sending needs the Claude app. You can also tell Claude in your chat.';
  if (!db) { banner(h('span', { text: 'Working offline: edits stay in this tab. Open the page in the Claude app to save versions and notes.' })); updateHeader(); return; }
  updateHeader(); renderTabs();
  const loading = setTimeout(() => banner(h('span', { text: 'Still connecting to saved versions. Showing the starting point until they load.' })), 10000);
  let seenReply = store.get('reply.' + EID) || '';
  db.collection(ITEMS).limit(1000).onSnapshot(q => {
    if (!q.metadata.fromCache) { clearTimeout(loading); if (!S.remotePending) banner(null); }
    const all = q.docs.map(d => Object.assign({ id: d.id }, d.data()));
    const tOf = i => String(i.t || i.savedAt || i.createdAt || '');
    // Claude's round replies: answers per note, and notes it resolved
    const replies = all.filter(i => i.kind === 'reply').sort((a, b) => tOf(a).localeCompare(tOf(b)));
    const replyMap = {}, resolved = new Set();
    for (const r of replies) { Object.assign(replyMap, r.notes || {}); (r.resolve || []).forEach(id => resolved.add(id)); }
    S.rounds = replies;
    S.notes = all.filter(i => i.kind === 'note' || i.kind === 'ask').map(n => Object.assign({}, n, {
      reply: n.reply || replyMap[n.id] || '', status: n.status === 'open' && resolved.has(n.id) ? 'addressed' : n.status,
    })).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    const before = openProposals().length;
    S.proposals = all.filter(i => i.kind === 'proposal').sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    if (S.propsLoaded && openProposals().length > before) toast('Claude posted a choice for you');
    S.refs = all.filter(i => i.kind === 'ref' && ASSET_RE.test(String(i.assetId || ''))).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    S.versions = all.filter(i => i.kind === 'version').sort((a, b) => b.version - a.version);
    const last = replies[replies.length - 1];
    if (last && tOf(last) > seenReply) {
      seenReply = tOf(last); store.set('reply.' + EID, seenReply);
      banner([h('span', { class: 'dot claude' }), h('strong', { text: 'Claude:' }), h('span', { text: String(last.message || 'Finished a round.').slice(0, 400) }), h('div', { class: 'spacer' }), h('button', { class: 'btn small ghost', onclick: () => banner(null) }, 'Dismiss')]);
    }
    if (!q.metadata.fromCache) S.propsLoaded = true;
    fillBgSelect();
    const side = store.get('sideref'), bgr = store.get('bgref');
    if (side && !S.sideRef) { const r = S.refs.find(x => x.assetId === side); if (r) showBeside(r); }
    if (bgr && S.bg !== 'ref') { const r = S.refs.find(x => x.assetId === bgr); if (r) setBackground('ref:' + r.assetId); }
    // the newest version is the current one
    const d = S.versions[0];
    if (d && d.effect && d.version > S.baseVersion) {
      if (!changes().length || S.baseVersion === 0) { adoptBase(d); if (d.savedBy === 'claude' && S.propsLoaded && S.baseVersion) toast(`Claude saved v${d.version}` + (d.message ? `: ${d.message}` : '')); }
      else {
        S.remotePending = d;
        banner([h('strong', { text: `${d.savedBy === 'claude' ? 'Claude' : 'Someone'} saved v${d.version}` }), h('span', { class: 'muted', text: d.message || '' }), h('div', { class: 'spacer' }),
          h('button', { class: 'btn small primary', onclick: () => { adoptBase(S.remotePending); S.remotePending = null; banner(null); } }, `Load v${d.version} (drops your edits)`),
          h('button', { class: 'btn small', onclick: () => { const keep = S.cur; adoptBase(S.remotePending, true); S.cur = keep; S.remotePending = null; banner(null); edited(); } }, 'Keep my edits on top')]);
      }
    }
    renderTabs(); drawPins();
  }, err => { clearTimeout(loading); banner(h('span', { text: 'Saved versions are unavailable right now (' + err.code + '). Edits stay in this tab.' })); });
}
boot();
})();
</script>
